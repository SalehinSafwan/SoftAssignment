services:

  # SPRING BOOT APPLICATION

  app:

    build: .

    container_name: university_app

    ports:
      - "8081:8080"

    environment:

      SERVER_PORT: 8080

      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

      DB_USERNAME: ${MYSQL_USER}

      DB_PASSWORD: ${MYSQL_PASSWORD}

      ADMIN_EMAIL: ${ADMIN_EMAIL}

      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    depends_on:

      db:
        condition: service_healthy

    restart: unless-stopped


  # MYSQL DATABASE

  db:

    image: mysql:8.4

    container_name: university_db

    environment:

      MYSQL_DATABASE: ${MYSQL_DATABASE}

      MYSQL_USER: ${MYSQL_USER}

      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:

      # TCP ping only succeeds once MySQL's init phase is finished
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD --silent"]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 30s

    restart: unless-stopped


# PERSISTENT DATABASE STORAGE

volumes:

  mysql_data:
