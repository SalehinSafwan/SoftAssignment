<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- LOGIN VIEW -->

<section id="login-view" class="login-wrapper hidden">

    <form id="login-form" class="card login-card">

        <h1>University Management</h1>
        <p class="muted">Sign in to continue</p>

        <label for="login-email">Email</label>
        <input id="login-email" type="email" required autocomplete="username"
               placeholder="admin@university.edu">

        <label for="login-password">Password</label>
        <input id="login-password" type="password" required autocomplete="current-password"
               placeholder="••••••••">

        <p id="login-error" class="error hidden"></p>

        <button type="submit" class="btn btn-primary btn-block">Login</button>

    </form>

</section>


<!-- DASHBOARD VIEW -->

<section id="dashboard-view" class="hidden">

    <header class="topbar">

        <div class="brand">University Management</div>

        <div class="user-info">
            <span id="current-user"></span>
            <span id="current-role" class="badge"></span>
            <button id="logout-btn" class="btn btn-light">Logout</button>
        </div>

    </header>

    <main class="container">

        <!-- Tabs are generated based on the logged-in user's role -->
        <nav id="tabs" class="tabs"></nav>

        <div class="card">

            <div class="toolbar">
                <h2 id="resource-title"></h2>
                <button id="add-btn" class="btn btn-primary">+ Add</button>
            </div>

            <p id="message" class="hidden"></p>

            <div class="table-wrapper">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Phone</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>

        </div>

    </main>

</section>


<!-- CREATE / EDIT DIALOG -->

<div id="modal" class="modal hidden">

    <form id="user-form" class="card modal-card">

        <h2 id="form-title"></h2>

        <label for="form-name">Name</label>
        <input id="form-name" required>

        <label for="form-email">Email</label>
        <input id="form-email" type="email" required>

        <label for="form-password">Password</label>
        <input id="form-password" type="password" autocomplete="new-password">
        <small id="password-hint" class="muted"></small>

        <label for="form-department">Department</label>
        <input id="form-department">

        <label for="form-phone">Phone</label>
        <input id="form-phone">

        <p id="form-error" class="error hidden"></p>

        <div class="modal-actions">
            <button type="button" id="cancel-btn" class="btn btn-light">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>

    </form>

</div>

<script src="/js/app.js"></script>
</body>
</html>
