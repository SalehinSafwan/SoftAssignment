spring.application.name=university-management

# Database Configuration (MySQL 8)
# Defaults are for local runs; Docker Compose overrides them via environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/university_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Initial Admin Account
app.admin.email=${ADMIN_EMAIL:admin@university.edu}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# Actuator
management.endpoints.web.exposure.include=health

# Server Configuration
server.port=${SERVER_PORT:8081}
