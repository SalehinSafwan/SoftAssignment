# Loaded only when a test uses @ActiveProfiles("test").
# Values here OVERRIDE src/main/resources/application.properties.

# In-memory H2 database instead of MySQL: created when the tests start, gone when they finish
spring.datasource.url=jdbc:h2:mem:university_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Build the tables fresh for every test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Seed admin that DataInitializer creates on startup (tests log in with it)
app.admin.email=admin@test.edu
app.admin.password=AdminTest@123
