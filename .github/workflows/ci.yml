# CONTINUOUS INTEGRATION PIPELINE
# Runs automatically on every push and pull request to main/master,
# and can also be started by hand from the "Actions" tab (workflow_dispatch).

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  # JOB 1: UNIT TESTS (fast, no database, no Spring context)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven            # reuse downloaded dependencies between runs

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw        # files committed from Windows lose the +x bit

      - name: Run unit tests (*Test.java via Surefire)
        run: ./mvnw -B test

      - name: Upload unit test reports
        if: always()              # upload even when tests fail, so you can read why
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/


  # JOB 2: INTEGRATION TESTS (full Spring Boot app + H2 database)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests             # only runs if the unit tests passed

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Run integration tests (*IT.java via Failsafe) and build the jar
        run: ./mvnw -B verify -DskipUTs=true

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: target/failsafe-reports/

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: university-management-jar
          path: target/*.jar
